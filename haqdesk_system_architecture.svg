<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D4AE2"/></marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .t{font-family:Arial,sans-serif;fill:#0F172A}.s{font-family:Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#E2E8F0;stroke-width:2}.soft{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:2}.purple{fill:#F4F1FF;stroke:#6D4AE2;stroke-width:3}.green{fill:#ECFDF5;stroke:#10B981;stroke-width:2}.warn{fill:#FFFBEB;stroke:#F59E0B;stroke-width:2;stroke-dasharray:10 7}.line{fill:none;stroke:#6D4AE2;stroke-width:4;marker-end:url(#arrow)}.db{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrowDark)}
    </style>
