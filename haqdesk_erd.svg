<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
<defs>
 <marker id="one" markerWidth="14" markerHeight="18" refX="2" refY="9" orient="auto"><path d="M2 2V16M7 2V16" stroke="#111" stroke-width="1.7" fill="none"/></marker>
 <marker id="many" markerWidth="22" markerHeight="20" refX="20" refY="10" orient="auto"><path d="M20 2L3 10L20 18M16 2V18" stroke="#111" stroke-width="1.7" fill="none"/></marker>
 <marker id="optionalMany" markerWidth="30" markerHeight="22" refX="28" refY="11" orient="auto"><circle cx="5" cy="11" r="4" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M28 3L12 11L28 19" stroke="#111" stroke-width="1.7" fill="none"/></marker>
 <marker id="optionalOne" markerWidth="24" markerHeight="20" refX="22" refY="10" orient="auto"><circle cx="5" cy="10" r="4" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M16 2V18" stroke="#111" stroke-width="1.7"/></marker>
 <style>.title{font:700 31px Arial,sans-serif;fill:#111}.sub{font:16px Arial,sans-serif;fill:#333}.table{fill:#fff;stroke:#111;stroke-width:1.5}.head{fill:#f4f4f4;stroke:#111;stroke-width:1.5}.name{font:700 17px Arial,sans-serif;fill:#111}.attr{font:14px Arial,sans-serif;fill:#111}.key{font:700 14px Arial,sans-serif;fill:#111}.rel{fill:none;stroke:#111;stroke-width:1.6}.logical{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:7 5}.label{font:700 17px Arial,sans-serif;fill:#111}.note{font:13px Arial,sans-serif;fill:#333}.underline{text-decoration:underline}</style>
</defs>
<rect width="2400" height="1500" fill="#fff"/>
<text x="1200" y="52" text-anchor="middle" class="title">HaqDesk AI - Entity Relationship Diagram (ERD)</text>
<text x="1200" y="82" text-anchor="middle" class="sub">Implemented PostgreSQL entities, crow's-foot relationships, and the Qdrant vector-store link</text>

<!-- relationships: declared SQL foreign keys -->
<path d="M1200 320V345H210V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="470" y="339" class="label">employs</text>
<path d="M1200 320V352H560V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="700" y="347" class="label">issues invitations</text>
<path d="M1200 320V360H910V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="980" y="375" class="label">configures</text>
<path d="M1200 320V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="1213" y="365" class="label">serves</text>
<path d="M1200 320V360H1650V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="1430" y="354" class="label">owns identity links</text>
<path d="M1200 320V345H2130V390" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="1810" y="339" class="label">uploads</text>
<path d="M1200 320V760H690V800" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="850" y="751" class="label">contains conversations</text>
<path d="M1200 320V770H1960V800" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="1640" y="765" class="label">isolates chunks by business_id</text>

<path d="M210 720V760H690V800" class="rel" marker-start="url(#optionalOne)" marker-end="url(#optionalMany)"/><text x="370" y="754" class="label">assigned to</text>
<path d="M350 535H410" class="rel" marker-start="url(#optionalOne)" marker-end="url(#optionalMany)"/><text x="359" y="520" class="label">invited through</text>
<path d="M1060 555H1020V840H690" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="915" y="822" class="label">starts</text>
<path d="M1410 520H1500" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="1419" y="505" class="label">master customer</text>
<path d="M1410 575H1470V610H1500" class="rel" marker-start="url(#one)" marker-end="url(#optionalOne)"/><text x="1418" y="600" class="label">linked customer</text>
<path d="M350 650H1470V680H1500" class="rel" marker-start="url(#optionalOne)" marker-end="url(#optionalMany)"/><text x="1060" y="644" class="label">linked by user</text>
<path d="M1060 680H1015V705H1060" class="rel" marker-start="url(#optionalOne)" marker-end="url(#optionalMany)"/><text x="885" y="708" class="label">merged into / potential match</text>
<path d="M860 950H1050" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="910" y="933" class="label">contains</text>
<path d="M2130 615V800" class="rel" marker-start="url(#one)" marker-end="url(#optionalMany)"/><text x="2145" y="724" class="label">splits into</text>
<!-- logical sender and vector links -->
<path d="M210 720V1215H1230V1110" class="logical" marker-start="url(#optionalOne)" marker-end="url(#optionalMany)"/><text x="720" y="1208" class="label">sender_id (logical only — no FK)</text>
<path d="M2130 1045V1180" class="logical" marker-start="url(#one)" marker-end="url(#one)"/><text x="2145" y="1124" class="label">indexed as</text>

<!-- Business -->
<g><rect x="1030" y="120" width="340" height="200" class="table"/><rect x="1030" y="120" width="340" height="38" class="head"/><text x="1200" y="145" text-anchor="middle" class="name">Business</text><path d="M1075 158V320M1030 190H1370" stroke="#111"/><text x="1043" y="181" class="key">PK</text><text x="1090" y="181" class="key underline">id</text><text x="1090" y="211" class="attr">name</text><text x="1090" y="235" class="attr">email, phone, website</text><text x="1090" y="259" class="attr">description, logo_url</text><text x="1090" y="283" class="attr">is_active, ai_response_mode</text><text x="1090" y="307" class="attr">created_at, updated_at</text></g>

<!-- User -->
<g><rect x="70" y="390" width="280" height="330" class="table"/><rect x="70" y="390" width="280" height="38" class="head"/><text x="210" y="415" text-anchor="middle" class="name">User</text><path d="M115 428V720M70 460H350" stroke="#111"/><text x="82" y="451" class="key">PK</text><text x="130" y="451" class="key underline">id</text><text x="82" y="481" class="key">FK</text><text x="130" y="481" class="attr">business_id</text><text x="130" y="509" class="attr">name</text><text x="130" y="533" class="attr">email</text><text x="130" y="557" class="attr">hashed_password</text><text x="130" y="581" class="attr">role, status</text><text x="130" y="605" class="attr">last_seen_at, created_at</text><text x="130" y="629" class="attr">provider, google_id</text><text x="130" y="653" class="attr">avatar_url</text><text x="130" y="677" class="attr">email_verified</text></g>
<!-- Invitation -->
<g><rect x="410" y="390" width="300" height="275" class="table"/><rect x="410" y="390" width="300" height="38" class="head"/><text x="560" y="415" text-anchor="middle" class="name">Invitation</text><path d="M455 428V665M410 460H710" stroke="#111"/><text x="422" y="451" class="key">PK</text><text x="470" y="451" class="key underline">id</text><text x="422" y="481" class="key">FK</text><text x="470" y="481" class="attr">business_id</text><text x="470" y="509" class="attr">email</text><text x="470" y="533" class="attr">role</text><text x="470" y="557" class="attr">token [unique]</text><text x="470" y="581" class="attr">accepted, revoked</text><text x="470" y="605" class="attr">created_at</text><text x="470" y="629" class="attr">expires_at</text></g>
<!-- Integration -->
<g><rect x="760" y="390" width="300" height="330" class="table"/><rect x="760" y="390" width="300" height="38" class="head"/><text x="910" y="415" text-anchor="middle" class="name">Integration</text><path d="M805 428V720M760 460H1060" stroke="#111"/><text x="772" y="451" class="key">PK</text><text x="820" y="451" class="key underline">id</text><text x="772" y="481" class="key">FK</text><text x="820" y="481" class="attr">business_id</text><text x="820" y="509" class="attr">platform</text><text x="820" y="533" class="attr">page_id, page_name</text><text x="820" y="557" class="attr">access_token</text><text x="820" y="581" class="attr">refresh_token</text><text x="820" y="605" class="attr">expires_at</text><text x="820" y="629" class="attr">metadata_json</text><text x="820" y="653" class="attr">status</text><text x="820" y="677" class="attr">created_at, updated_at</text></g>
<!-- Customer -->
<g><rect x="1060" y="390" width="350" height="350" class="table"/><rect x="1060" y="390" width="350" height="38" class="head"/><text x="1235" y="415" text-anchor="middle" class="name">Customer</text><path d="M1105 428V740M1060 460H1410" stroke="#111"/><text x="1072" y="451" class="key">PK</text><text x="1120" y="451" class="key underline">id</text><text x="1072" y="481" class="key">FK</text><text x="1120" y="481" class="attr">business_id</text><text x="1120" y="509" class="attr">platform, platform_user_id</text><text x="1120" y="533" class="attr">display_name</text><text x="1120" y="557" class="attr">phone, email, avatar_url</text><text x="1120" y="581" class="attr">notes, is_merged</text><text x="1072" y="609" class="key">FK</text><text x="1120" y="609" class="attr">merged_into_id [nullable]</text><text x="1072" y="637" class="key">FK</text><text x="1120" y="637" class="attr">potential_match_customer_id [nullable]</text><text x="1120" y="665" class="attr">last_seen</text><text x="1120" y="689" class="attr">created_at</text></g>
<!-- CustomerIdentity -->
<g><rect x="1500" y="390" width="300" height="290" class="table"/><rect x="1500" y="390" width="300" height="38" class="head"/><text x="1650" y="415" text-anchor="middle" class="name">CustomerIdentity</text><path d="M1545 428V680M1500 460H1800" stroke="#111"/><text x="1512" y="451" class="key">PK</text><text x="1560" y="451" class="key underline">id</text><text x="1512" y="481" class="key">FK</text><text x="1560" y="481" class="attr">business_id</text><text x="1512" y="509" class="key">FK</text><text x="1560" y="509" class="attr">master_customer_id</text><text x="1512" y="537" class="key">FK</text><text x="1560" y="537" class="attr">linked_customer_id [unique]</text><text x="1512" y="565" class="key">FK</text><text x="1560" y="565" class="attr">linked_by_user_id [nullable]</text><text x="1560" y="593" class="attr">created_at</text></g>
<!-- KnowledgeDocument -->
<g><rect x="1980" y="390" width="300" height="225" class="table"/><rect x="1980" y="390" width="300" height="38" class="head"/><text x="2130" y="415" text-anchor="middle" class="name">KnowledgeDocument</text><path d="M2025 428V615M1980 460H2280" stroke="#111"/><text x="1992" y="451" class="key">PK</text><text x="2040" y="451" class="key underline">id</text><text x="1992" y="481" class="key">FK</text><text x="2040" y="481" class="attr">business_id</text><text x="2040" y="509" class="attr">filename</text><text x="2040" y="533" class="attr">status</text><text x="2040" y="557" class="attr">uploaded_at</text><text x="2040" y="586" class="note">Chunks cascade on delete.</text></g>

<!-- Conversation -->
<g><rect x="520" y="800" width="340" height="310" class="table"/><rect x="520" y="800" width="340" height="38" class="head"/><text x="690" y="825" text-anchor="middle" class="name">Conversation</text><path d="M565 838V1110M520 870H860" stroke="#111"/><text x="532" y="861" class="key">PK</text><text x="580" y="861" class="key underline">id</text><text x="532" y="891" class="key">FK</text><text x="580" y="891" class="attr">business_id</text><text x="532" y="919" class="key">FK</text><text x="580" y="919" class="attr">customer_id</text><text x="532" y="947" class="key">FK</text><text x="580" y="947" class="attr">assigned_agent_id [nullable]</text><text x="580" y="975" class="attr">status, priority</text><text x="580" y="999" class="attr">is_deleted, deleted_at</text><text x="580" y="1023" class="attr">created_at, closed_at</text><text x="580" y="1047" class="attr">last_read_at</text></g>
<!-- Message -->
<g><rect x="1050" y="800" width="360" height="310" class="table"/><rect x="1050" y="800" width="360" height="38" class="head"/><text x="1230" y="825" text-anchor="middle" class="name">Message</text><path d="M1095 838V1110M1050 870H1410" stroke="#111"/><text x="1062" y="861" class="key">PK</text><text x="1110" y="861" class="key underline">id</text><text x="1062" y="891" class="key">FK</text><text x="1110" y="891" class="attr">conversation_id</text><text x="1110" y="919" class="attr">sender_type</text><text x="1110" y="943" class="attr">sender_id*</text><text x="1110" y="967" class="attr">content, message_type</text><text x="1110" y="991" class="attr">platform, timestamp</text><text x="1110" y="1015" class="attr">ai_draft, ai_language</text><text x="1110" y="1039" class="attr">sentiment, ai_metadata</text><text x="1110" y="1070" class="note">*Logical user ID; not a declared FK.</text></g>
<!-- KnowledgeChunk -->
<g><rect x="1810" y="800" width="300" height="245" class="table"/><rect x="1810" y="800" width="300" height="38" class="head"/><text x="1960" y="825" text-anchor="middle" class="name">KnowledgeChunk</text><path d="M1855 838V1045M1810 870H2110" stroke="#111"/><text x="1822" y="861" class="key">PK</text><text x="1870" y="861" class="key underline">id</text><text x="1822" y="891" class="key">FK</text><text x="1870" y="891" class="attr">document_id</text><text x="1822" y="919" class="key">FK</text><text x="1870" y="919" class="attr">business_id</text><text x="1870" y="947" class="attr">content</text><text x="1870" y="971" class="attr">page_number</text></g>

<!-- Qdrant external -->
<g><rect x="1780" y="1180" width="580" height="245" fill="#fff" stroke="#555" stroke-width="1.7" stroke-dasharray="8 5"/><rect x="1780" y="1180" width="580" height="42" fill="#f4f4f4" stroke="#555" stroke-width="1.5" stroke-dasharray="8 5"/><text x="2070" y="1207" text-anchor="middle" class="name">QdrantPoint — Non-relational vector store</text><path d="M1880 1222V1425M1780 1254H2360" stroke="#555" stroke-dasharray="8 5"/><text x="1800" y="1245" class="key">ID</text><text x="1900" y="1245" class="key underline">point_id = KnowledgeChunk.id</text><text x="1800" y="1282" class="key">VECTOR</text><text x="1900" y="1282" class="attr">BAAI/bge-m3 embedding [1024-dim, cosine]</text><text x="1800" y="1310" class="key">PAYLOAD</text><text x="1900" y="1310" class="attr">business_id</text><text x="1900" y="1334" class="attr">document_id, chunk_id</text><text x="1900" y="1358" class="attr">content, page_number, filename</text><text x="1900" y="1394" class="note">Collection: techsuru_collection</text></g>

<text x="70" y="1460" class="note">Crow’s-foot legend:  || exactly one   •   o| zero or one   •   o&lt; zero or many   •   dashed line logical / cross-database relationship</text>
</svg>
