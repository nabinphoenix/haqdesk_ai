<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D4AE2"/></marker><style>.t{font-family:Arial,sans-serif;fill:#0F172A}.s{font-family:Arial,sans-serif;fill:#475569}.b{fill:#fff;stroke:#E2E8F0;stroke-width:2}.p{fill:#F4F1FF;stroke:#6D4AE2;stroke-width:2.5}.g{fill:#ECFDF5;stroke:#10B981;stroke-width:2.5}.w{fill:#FFFBEB;stroke:#F59E0B;stroke-width:2}.l{fill:none;stroke:#6D4AE2;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g><text x="72" y="64" class="t" font-size="38" font-weight="700">RAG System Design</text></g>
  <g><text x="72" y="102" class="s" font-size="21">How business documents are processed, retrieved and used to generate reviewed replies.</text></g>
  <rect x="55" y="135" width="700" height="690" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="85" y="175" class="t" font-size="24" font-weight="700">A. Knowledge ingestion</text><text x="85" y="202" class="s" font-size="15">Admin-only upload endpoint with tenant metadata</text>
  <rect x="90" y="235" width="185" height="72" rx="15" class="b"/><text x="182" y="264" text-anchor="middle" class="t" font-size="17" font-weight="700">1  Business user</text><text x="182" y="287" text-anchor="middle" class="s" font-size="13">Uploads PDF/DOCX/TXT</text>
  <rect x="315" y="235" width="185" height="72" rx="15" class="p"/><text x="408" y="264" text-anchor="middle" class="t" font-size="17" font-weight="700">2  POST /upload</text><text x="408" y="287" text-anchor="middle" class="s" font-size="13">≤10 MB + extension check</text>
  <rect x="540" y="235" width="180" height="72" rx="15" class="w"/><text x="630" y="263" text-anchor="middle" class="t" font-size="16" font-weight="700">3  Temp file</text><text x="630" y="286" text-anchor="middle" class="s" font-size="13">Background task</text>
  <path d="M275 271H315" class="l"/><path d="M500 271H540" class="l"/>
  <rect x="90" y="355" width="180" height="72" rx="15" class="b"/><text x="180" y="383" text-anchor="middle" class="t" font-size="16" font-weight="700">4  Text extraction</text><text x="180" y="406" text-anchor="middle" class="s" font-size="13">PyMuPDF fitz.open</text>
  <rect x="300" y="355" width="180" height="72" rx="15" class="b"/><text x="390" y="383" text-anchor="middle" class="t" font-size="16" font-weight="700">5  Parse / chunk</text><text x="390" y="406" text-anchor="middle" class="s" font-size="13">Q&amp;A parser or 500/50 words</text>
  <rect x="510" y="355" width="210" height="72" rx="15" class="p"/><text x="615" y="383" text-anchor="middle" class="t" font-size="16" font-weight="700">6  Embed batch</text><text x="615" y="406" text-anchor="middle" class="s" font-size="13">BAAI/bge-m3 • 1024-dim</text>
  <path d="M630 307V330H180V355" class="l"/><path d="M270 391H300" class="l"/><path d="M480 391H510" class="l"/>
  <rect x="90" y="485" width="285" height="145" rx="18" class="b"/><text x="232" y="520" text-anchor="middle" class="t" font-size="19" font-weight="700">PostgreSQL metadata</text><text x="232" y="548" text-anchor="middle" class="s" font-size="14">KnowledgeDocument</text><text x="232" y="572" text-anchor="middle" class="s" font-size="14">KnowledgeChunk + page + content</text><text x="232" y="596" text-anchor="middle" class="s" font-size="14">document_id + business_id</text>
  <rect x="415" y="475" width="305" height="165" rx="18" class="p"/><text x="567" y="511" text-anchor="middle" class="t" font-size="20" font-weight="700">Qdrant vector storage</text><text x="567" y="539" text-anchor="middle" class="s" font-size="14">techsuru_collection • cosine</text><text x="567" y="565" text-anchor="middle" class="s" font-size="14">Payload: business_id, document_id,</text><text x="567" y="588" text-anchor="middle" class="s" font-size="14">chunk_id, content, page, filename</text><rect x="456" y="606" width="223" height="25" rx="12" fill="#6D4AE2"/><text x="567" y="624" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">TENANT FILTER METADATA</text>
  <path d="M615 427V450H232V485" class="l"/><path d="M615 427V475" class="l"/>
  <rect x="90" y="675" width="630" height="105" rx="17" class="w"/><text x="405" y="707" text-anchor="middle" class="t" font-size="17" font-weight="700">Verified limitation</text><text x="405" y="733" text-anchor="middle" class="s" font-size="14">Upload accepts PDF/DOCX/TXT, but ingestion uses PyMuPDF for every type.</text><text x="405" y="756" text-anchor="middle" class="s" font-size="14">Document status is created as “processing” and is not updated after ingestion.</text>

  <rect x="790" y="135" width="755" height="690" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="820" y="175" class="t" font-size="24" font-weight="700">B. AI response generation</text><text x="820" y="202" class="s" font-size="15">Customer question → tenant retrieval → grounded suggestion → human decision</text>
  <rect x="825" y="235" width="190" height="72" rx="15" class="b"/><text x="920" y="263" text-anchor="middle" class="t" font-size="16" font-weight="700">1  Customer message</text><text x="920" y="286" text-anchor="middle" class="s" font-size="13">Stored with conversation</text>
  <rect x="1050" y="235" width="205" height="72" rx="15" class="b"/><text x="1152" y="263" text-anchor="middle" class="t" font-size="16" font-weight="700">2  Preprocess</text><text x="1152" y="286" text-anchor="middle" class="s" font-size="13">Language + sentiment + history</text>
  <rect x="1290" y="235" width="215" height="72" rx="15" class="p"/><text x="1398" y="263" text-anchor="middle" class="t" font-size="16" font-weight="700">3  Query embedding</text><text x="1398" y="286" text-anchor="middle" class="s" font-size="13">BAAI/bge-m3</text>
  <path d="M1015 271H1050" class="l"/><path d="M1255 271H1290" class="l"/>
  <rect x="825" y="350" width="300" height="130" rx="18" class="p"/><text x="975" y="382" text-anchor="middle" class="t" font-size="19" font-weight="700">4  Qdrant retrieval</text><text x="975" y="408" text-anchor="middle" class="s" font-size="14">Finds relevant business-document chunks</text><text x="975" y="433" text-anchor="middle" class="s" font-size="14">top_k = 5 • business_id filter</text><text x="975" y="458" text-anchor="middle" class="s" font-size="14">Returns scores + source metadata</text>
  <rect x="1165" y="350" width="340" height="130" rx="18" class="w"/><text x="1335" y="382" text-anchor="middle" class="t" font-size="19" font-weight="700">5  Confidence check</text><text x="1335" y="409" text-anchor="middle" class="s" font-size="14">Top score ≥ 0.45 → use retrieved context</text><text x="1335" y="435" text-anchor="middle" class="s" font-size="14">Below 0.45 → ask support team to confirm</text><text x="1335" y="458" text-anchor="middle" class="s" font-size="13">No cross-business or policy assumptions</text>
  <path d="M1398 307V330H975V350" class="l"/><path d="M1125 415H1165" class="l"/>
  <rect x="825" y="525" width="205" height="90" rx="16" class="b"/><text x="927" y="557" text-anchor="middle" class="t" font-size="17" font-weight="700">6  Build prompt</text><text x="927" y="581" text-anchor="middle" class="s" font-size="13">Context + history + mode</text><text x="927" y="601" text-anchor="middle" class="s" font-size="13">language + sentiment</text>
  <rect x="1060" y="525" width="220" height="90" rx="16" class="p"/><text x="1170" y="557" text-anchor="middle" class="t" font-size="17" font-weight="700">7  LiteLLM</text><text x="1170" y="581" text-anchor="middle" class="s" font-size="13">Groq primary</text><text x="1170" y="601" text-anchor="middle" class="s" font-size="13">Configured fallback models</text>
  <rect x="1310" y="525" width="195" height="90" rx="16" class="g"/><text x="1407" y="557" text-anchor="middle" class="t" font-size="17" font-weight="700">8  AI suggestion</text><text x="1407" y="581" text-anchor="middle" class="s" font-size="13">Draft + confidence</text><text x="1407" y="601" text-anchor="middle" class="s" font-size="13">sources + model metadata</text>
  <path d="M1335 480V500H927V525" class="l"/><path d="M1030 570H1060" class="l"/><path d="M1280 570H1310" class="l"/>
  <rect x="825" y="660" width="465" height="120" rx="19" class="g"/><text x="1058" y="692" text-anchor="middle" class="t" font-size="20" font-weight="700">9  Human review is the central control</text><rect x="855" y="716" width="110" height="42" rx="12" class="b"/><text x="910" y="742" text-anchor="middle" class="t" font-size="15" font-weight="700">Accept</text><rect x="1002" y="716" width="110" height="42" rx="12" class="b"/><text x="1057" y="742" text-anchor="middle" class="t" font-size="15" font-weight="700">Edit</text><rect x="1148" y="716" width="110" height="42" rx="12" class="b"/><text x="1203" y="742" text-anchor="middle" class="t" font-size="15" font-weight="700">Reject</text>
  <rect x="1325" y="660" width="180" height="120" rx="19" class="p"/><text x="1415" y="692" text-anchor="middle" class="t" font-size="17" font-weight="700">10  Approved reply</text><text x="1415" y="719" text-anchor="middle" class="s" font-size="13">Meta Graph API</text><text x="1415" y="741" text-anchor="middle" class="s" font-size="13">then PostgreSQL</text><text x="1415" y="763" text-anchor="middle" class="s" font-size="12">ai_assisted metadata</text>
  <path d="M1407 615V640H1058V660" class="l"/><path d="M1290 720H1325" class="l"/>
  <text x="72" y="865" class="s" font-size="14">Review mode is the demonstrated human-in-the-loop path. Auto mode also exists in code and sends only after channel acceptance.</text>
</svg>
